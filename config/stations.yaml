# Resolution source for all cities (except Hong Kong): Weather Underground daily high.
# Brackets are whole-degree integers; ±0.5° adjustment applied automatically in bracket parsing.
#
# Hong Kong: Hong Kong Observatory King's Park station (not Wunderground).
#   Precision: one decimal place — do NOT set "wholedeg" in resolution_field for VHHH.
#   VHHH ICAO is used for NWP forecast input only.
#
# Denver: Polymarket resolves against KBKF (Buckley Space Force Base, Aurora CO),
#   NOT Denver International (KDEN).
#
# NYC: Polymarket resolves against KLGA (LaGuardia), NOT KJFK or KNYC.
#
# Lock time strategy:
#   Asian group  (08:xx z): D-1 local afternoon, uses freshly-available 00z ECMWF run
#   European group (19:3x z): D-1 local evening, uses freshly-available 12z ECMWF run
#   US group     (21:xx z): D-1 local afternoon, uses 12z ECMWF run (2h old)
#   Ingest fires 30 min before lock (computed automatically by scheduler).
#   Execute fires 5 min after lock.
#
# Forecast aggregation mode (optional per-station field `bma_mode`):
#   bma       (default) — Bayesian model averaging across ECMWF / GEFS / ICON / WN2.
#   wn2_only            — Use only the WeatherNext 2 64-member ensemble (sampled
#                         at the nearest 0.25° grid cell to the station, 6h cadence).
#                         μ/σ come from the WN2 members directly (WN2-specific EMOS
#                         applied if cached). Use this to benchmark WN2 alone or
#                         when other ingests are unreliable. Lock job will still
#                         ingest the other models for future analysis, but won't
#                         use them for the pick.
#
# Intraday short-lead lock (optional per-station field `intraday_lock_time_utc`):
#   Format "HH:MM" UTC. When set, the scheduler fires an EXTRA lock at this time
#   that targets the SAME day's daily max using the freshest WN2 init (6-12h lead
#   to local afternoon peak) — independent of the regular D-1 evening lock.
#   bma_mode is forced to wn2_only for the intraday run regardless of the
#   per-station bma_mode. The execute job follows 5 minutes after, gated by the
#   same TRADING_ENABLED / LIVE_TRADING / LIVE_STATIONS flags as regular trades.
#   Pick a time ~1-2h before the station's local afternoon peak (~14:00-16:00 local).

# ── Asian group — lock 08:00-08:12z (00z ECMWF, D-1 local afternoon) ──────────

RKSI:
  name: Incheon International Airport (Seoul)
  lat: 37.4692
  lon: 126.4505
  timezone: Asia/Seoul
  unit: celsius
  market_slug_pattern: "highest-temperature-in-seoul-on-{month_lower}-{day}-{year}"
  resolution_field: "daily_max_metar_local_wholedeg"
  lock_time_utc: "08:00"  # 17:00 KST — D-1
  intraday_lock_time_utc: "03:00"  # 2h before Seoul peak ~05-06z; 6h window covers it; uses 18z prior init
  min_liquidity: 25  # Asian markets persistently thin at lock time

