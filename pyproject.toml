[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-edge"
version = "0.1.0"
description = "Daily pipeline: ensemble forecasts → EMOS calibration → Polymarket edge detection"
requires-python = ">=3.11"
dependencies = [
    "xarray>=2024.1.0",
    "cfgrib>=0.9.14",
    "eccodes>=2.3.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.0",
    "fsspec>=2024.3.0",
    "s3fs>=2024.3.0",
    "matplotlib>=3.8.0",
    "ecmwf-opendata>=0.3.0",
    "scikit-learn>=1.4.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "apscheduler>=3.10.0",
    "py-clob-client>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "properscoring>=0.1",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.0",
    "respx>=0.21.0",
]

[project.scripts]
we = "weather_edge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_edge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
